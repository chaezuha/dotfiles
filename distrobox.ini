# Create/rebuild with silverblue/assemble.sh (it fills in @HOME@), never
# `distrobox assemble` directly. main has no home= on purpose: it shares the
# real home. Every other box gets its own under ~/distrobox/<name>.
# :latest plus pull=true means `assemble.sh --replace` moves a box to the
# current Fedora release.
[main]
image=docker.io/library/fedora:latest
pull=true
pre_init_hooks="export SHELL=/usr/bin/zsh;"
additional_packages="git stow wl-clipboard"
init_hooks="ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open;"

[dev]
image=docker.io/library/fedora:latest
pull=true
home=@HOME@/distrobox/dev
pre_init_hooks="export SHELL=/usr/bin/zsh;"
additional_packages="git stow wl-clipboard"
init_hooks="ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open;"

